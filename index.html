<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <title>Gym Takip</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="top">
    <button id="back" class="nav-back" aria-label="Geri" hidden></button>
    <div id="top-title"></div>
    <div id="top-action"></div>
  </header>

  <main id="view"></main>

  <div id="rest" hidden>
    <svg class="rest-ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" class="track"/><circle cx="20" cy="20" r="17" class="bar" id="rest-bar"/></svg>
    <div class="rest-info"><span>Dinlenme</span><b id="rest-time">1:30</b></div>
    <button data-rest="-15">−15</button>
    <button data-rest="15">+15</button>
    <button data-rest="skip" class="rest-skip">Geç</button>
  </div>
  <div id="toast" hidden></div>

  <nav id="tabs"></nav>

  <script type="module" src="app.js"></script>
</body>
</html>
